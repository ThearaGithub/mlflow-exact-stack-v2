# Spark defaults shared by spark-submit and the Jupyter PySpark session.
spark.driver.memory 768m
spark.sql.shuffle.partitions 2
spark.ui.enabled false

# Iceberg + Nessie REST catalog. Nessie serves the catalog at /iceberg and
# owns the warehouse (s3://warehouse/ in MinIO).
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.nessie org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.type rest
spark.sql.catalog.nessie.uri http://nessie:19120/iceberg
spark.sql.catalog.nessie.warehouse warehouse
spark.sql.defaultCatalog nessie
